name: Bug report
description: Report a reproducible problem with the app, worker, or rendered output.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DemoBro. Do not include secrets, beta passwords, private URLs, or customer videos.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web interface
        - Tour discovery
        - Browser recording
        - Video rendering
        - Deployment or self-hosting
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Enter...
        3. Observe...
    validations:
      required: true

  - type: input
    id: public-example
    attributes:
      label: Public example URL
      description: Optional. Only share a URL you own and are comfortable making public.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, Node.js version, and deployment platform when relevant.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed all secrets and private customer data.
          required: true
